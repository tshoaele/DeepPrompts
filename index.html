<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<title>Animus Prompt</title>

<!-- Offline Rajdhani font: base64 subset (squares, techy) -->
<style>
@font-face {
  font-family: 'Rajdhani';
  font-style: normal;
  font-weight: 400;
  src: url(data:font/woff2;base64,d09GMgABAAAAAA) format('woff2');
  /* placeholder — real font inlined below via system fallback */
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

:root {
  --bg:#0a0e14;
  --panel:#111823;
  --panel2:#0d131c;
  --line:#1e2a3a;
  --accent:#00e0ff;
  --accent2:#ff2e63;
  --text:#d8e6f0;
  --muted:#5f7a91;
  --glow:0 0 12px rgba(0,224,255,.45);
}

body.light {
  --bg:#eef3f7;
  --panel:#ffffff;
  --panel2:#f4f8fb;
  --line:#c9d8e4;
  --accent:#0077b6;
  --accent2:#d90429;
  --text:#0a1926;
  --muted:#5a6b7a;
  --glow:0 0 12px rgba(0,119,182,.35);
}

html,body {
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:'Rajdhani','Segoe UI',system-ui,-apple-system,sans-serif;
  font-weight:600;
  letter-spacing:.4px;
  overflow:hidden;
  transition:background .25s,color .25s;
}

/* Animus scanline overlay */
body::before {
  content:'';
  position:fixed; inset:0;
  pointer-events:none;
  background:repeating-linear-gradient(
    to bottom,
    rgba(0,224,255,.04) 0px,
    rgba(0,224,255,.04) 1px,
    transparent 1px,
    transparent 3px
  );
  z-index:9999;
  opacity:.7;
}
body.light::before { background:repeating-linear-gradient(to bottom,rgba(0,119,182,.05) 0px,rgba(0,119,182,.05) 1px,transparent 1px,transparent 3px); }

/* corner HUD brackets */
body::after {
  content:'';
  position:fixed; inset:8px;
  pointer-events:none;
  border:1px solid var(--accent);
  opacity:.18;
  z-index:9998;
  clip-path:polygon(
    0 0, 28px 0, 28px 2px, 2px 2px, 2px 28px, 0 28px,
    0 0, 100% 0, 100% 28px, calc(100% - 2px) 28px, calc(100% - 2px) 2px, calc(100% - 28px) 2px, calc(100% - 28px) 0,
    100% 0, 100% 100%, calc(100% - 28px) 100%, calc(100% - 28px) calc(100% - 2px), calc(100% - 2px) calc(100% - 2px), calc(100% - 2px) calc(100% - 28px), 100% calc(100% - 28px),
    100% 100%, 0 100%, 0 calc(100% - 28px), 2px calc(100% - 28px), 2px calc(100% - 2px), 28px calc(100% - 2px), 28px 100%
  );
  transition:border-color .25s;
}

.wrap {
  height:100%;
  display:flex;
  flex-direction:column;
  padding:calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));
  max-width:520px;
  margin:0 auto;
  gap:12px;
}

/* HEADER */
header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding-bottom:10px;
  border-bottom:1px solid var(--line);
  flex-shrink:0;
}

.brand {
  display:flex;
  align-items:center;
  gap:9px;
}

.logo {
  width:26px; height:26px;
  position:relative;
}
.logo svg { width:100%; height:100%; display:block; }
.logo .spin {
  transform-origin:center;
  animation:spin 14s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }

.title {
  font-size:1.05rem;
  font-weight:700;
  letter-spacing:2.5px;
  text-transform:uppercase;
  color:var(--text);
}
.title b { color:var(--accent); text-shadow:var(--glow); }

/* toggle */
.toggle {
  width:52px; height:26px;
  border:1px solid var(--line);
  background:var(--panel2);
  border-radius:2px;
  position:relative;
  cursor:pointer;
  flex-shrink:0;
  transition:.25s;
}
.toggle::after {
  content:'';
  position:absolute;
  top:2px; left:2px;
  width:20px; height:20px;
  background:var(--accent);
  box-shadow:var(--glow);
  transition:.25s;
  clip-path:polygon(0 0,100% 0,100% 100%,0 100%);
}
body.light .toggle::after { left:28px; background:var(--accent); }
.toggle:active::after { transform:scale(.85); }

/* MAIN */
main {
  flex:1;
  display:flex;
  flex-direction:column;
  gap:12px;
  min-height:0;
}

.label {
  font-size:.62rem;
  letter-spacing:3px;
  text-transform:uppercase;
  color:var(--muted);
  display:flex;
  align-items:center;
  gap:7px;
}
.label::before {
  content:'';
  width:6px; height:6px;
  background:var(--accent);
  box-shadow:var(--glow);
  animation:blink 2s infinite;
}
@keyframes blink { 50%{opacity:.25;} }

.inputBox {
  position:relative;
  background:var(--panel);
  border:1px solid var(--line);
  transition:.25s;
}
.inputBox::before {
  content:'';
  position:absolute;
  top:-1px; left:-1px;
  width:14px; height:14px;
  border-top:2px solid var(--accent);
  border-left:2px solid var(--accent);
  pointer-events:none;
}
.inputBox::after {
  content:'';
  position:absolute;
  bottom:-1px; right:-1px;
  width:14px; height:14px;
  border-bottom:2px solid var(--accent);
  border-right:2px solid var(--accent);
  pointer-events:none;
}
.inputBox.focus { border-color:var(--accent); box-shadow:var(--glow); }

textarea {
  width:100%;
  background:transparent;
  border:none;
  outline:none;
  color:var(--text);
  font-family:inherit;
  font-weight:600;
  font-size:.95rem;
  letter-spacing:.3px;
  padding:14px;
  resize:none;
  height:88px;
  line-height:1.5;
}
textarea::placeholder { color:var(--muted); font-weight:500; }

/* BUTTONS */
.btn {
  font-family:inherit;
  font-weight:700;
  letter-spacing:2.5px;
  text-transform:uppercase;
  font-size:.82rem;
  border:none;
  cursor:pointer;
  padding:16px;
  position:relative;
  transition:.18s;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  overflow:hidden;
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);
}

.btn.primary {
  background:var(--accent);
  color:#04121a;
  box-shadow:0 0 20px rgba(0,224,255,.35);
}
body.light .btn.primary { color:#fff; box-shadow:0 0 20px rgba(0,119,182,.35); }
.btn.primary:active { transform:scale(.975); filter:brightness(.9); }

.btn.primary.copied { background:var(--accent2); color:#fff; box-shadow:0 0 20px rgba(255,46,99,.4); }

.btn.ghost {
  background:var(--panel);
  color:var(--text);
  border:1px solid var(--line);
}
.btn.ghost:active { transform:scale(.975); border-color:var(--accent); }
.btn.ghost:disabled { opacity:.35; cursor:not-allowed; }

.btn svg { width:15px; height:15px; flex-shrink:0; }

/* preview */
.preview {
  background:var(--panel2);
  border:1px solid var(--line);
  border-left:2px solid var(--accent);
  padding:12px 14px;
  font-size:.8rem;
  line-height:1.55;
  color:var(--muted);
  flex:1;
  overflow-y:auto;
  min-height:60px;
  white-space:pre-wrap;
  word-break:break-word;
  display:none;
  scrollbar-width:thin;
  scrollbar-color:var(--accent) transparent;
}
.preview.show { display:block; }
.preview::-webkit-scrollbar { width:4px; }
.preview::-webkit-scrollbar-thumb { background:var(--accent); }
.preview b { color:var(--accent); font-weight:700; }

/* status bar */
.status {
  display:flex;
  justify-content:space-between;
  font-size:.58rem;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--muted);
  flex-shrink:0;
  padding-top:4px;
}
.status .dot { color:var(--accent); }

footer {
  font-size:.55rem;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--muted);
  text-align:center;
  flex-shrink:0;
  opacity:.7;
}

@media (max-height:620px) {
  textarea { height:64px; }
  .preview { min-height:44px; }
  .btn { padding:13px; }
}
</style>
</head>
<body>

<div class="wrap">

  <header>
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 100 100">
          <polygon class="spin" points="50,6 94,50 50,94 6,50" fill="none" stroke="var(--accent)" stroke-width="5"/>
          <polygon points="50,26 74,50 50,74 26,50" fill="var(--accent)" opacity="0.85"/>
        </svg>
      </div>
      <div class="title">ANIMUS<b>·PROMPT</b></div>
    </div>
    <div class="toggle" id="themeToggle" aria-label="Toggle theme"></div>
  </header>

  <main>
    <div class="label">Enter character or theme</div>

    <div class="inputBox" id="inputBox">
      <textarea id="userInput" placeholder="e.g. Ken from Street Fighter" spellcheck="false"></textarea>
    </div>

    <button class="btn primary" id="mainBtn">
      <svg id="mainIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      </svg>
      <span id="mainLabel">Generate</span>
    </button>

    <div class="preview" id="preview"></div>

    <button class="btn ghost" id="chatBtn" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      Open ChatGPT
    </button>
  </main>

  <div class="status">
    <span><span class="dot">●</span> OFFLINE READY</span>
    <span id="statusMsg">STANDBY</span>
  </div>

  <footer>Based on our conversation so far</footer>

</div>

<script>
(function(){
  const STORAGE = 'animus_prompt_theme';
  const body = document.body;
  const toggle = document.getElementById('themeToggle');
  const input = document.getElementById('userInput');
  const inputBox = document.getElementById('inputBox');
  const mainBtn = document.getElementById('mainBtn');
  const mainLabel = document.getElementById('mainLabel');
  const mainIcon = document.getElementById('mainIcon');
  const preview = document.getElementById('preview');
  const chatBtn = document.getElementById('chatBtn');
  const statusMsg = document.getElementById('statusMsg');

  let promptText = '';
  let isCopied = false;

  /* THEME */
  const savedTheme = localStorage.getItem(STORAGE);
  if (savedTheme === 'light') body.classList.add('light');

  toggle.addEventListener('click', () => {
    body.classList.toggle('light');
    localStorage.setItem(STORAGE, body.classList.contains('light') ? 'light' : 'dark');
    if (navigator.vibrate) navigator.vibrate(8);
  });

  /* INPUT FOCUS GLOW */
  input.addEventListener('focus', () => inputBox.classList.add('focus'));
  input.addEventListener('blur', () => inputBox.classList.remove('focus'));

  /* BUILD PROMPT */
  function buildPrompt(raw){
    const userInput = raw.trim();
    // if user already wrote a "world", don't append one
    const lower = userInput.toLowerCase();
    const hasWorld = /\b(world|universe|realm|setting|verse)\b/.test(lower);

    let tail;
    if (hasWorld) {
      tail = '';
    } else {
      // extract the character name (strip "from X" if present)
      const nameOnly = userInput.split(/\bfrom\b/i)[0].trim();
      tail = `, in ${nameOnly}'s world`;
    }

    return `Based on our conversation so far, create a ${userInput} inspired character visual that suits me${tail}, anime style, 9:16`;
  }

  /* MAIN BUTTON LOGIC */
  mainBtn.addEventListener('click', async () => {
    if (navigator.vibrate) navigator.vibrate(10);

    // STATE 1 → GENERATE
    if (!isCopied) {
      const raw = input.value.trim();
      if (!raw) {
        input.focus();
        statusMsg.textContent = 'INPUT REQUIRED';
        inputBox.classList.add('focus');
        setTimeout(()=>{ statusMsg.textContent='STANDBY'; }, 1800);
        return;
      }

      promptText = buildPrompt(raw);

      // show preview
      const safe = promptText
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      preview.innerHTML = safe.replace(/(Based on our conversation so far)/, '<b>$1</b>');
      preview.classList.add('show');

      // flip button to COPY
      isCopied = true;
      mainLabel.textContent = 'Copy Prompt';
      mainIcon.innerHTML = '<rect x="9" y="9" width="12" height="12" rx="1"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>';
      mainBtn.classList.remove('copied');
      chatBtn.disabled = false;
      statusMsg.textContent = 'READY TO COPY';
      return;
    }

    // STATE 2 → COPY
    try {
      await navigator.clipboard.writeText(promptText);
    } catch(e) {
      // fallback
      const ta = document.createElement('textarea');
      ta.value = promptText;
      ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }

    if (navigator.vibrate) navigator.vibrate([8,40,8]);

    mainLabel.textContent = 'Copied!';
    mainBtn.classList.add('copied');
    mainIcon.innerHTML = '<polyline points="20 6 9 17 4 12"/>';
    statusMsg.textContent = 'COPIED TO CLIPBOARD';

    setTimeout(()=>{
      mainLabel.textContent = 'Copy Prompt';
      mainBtn.classList.remove('copied');
      mainIcon.innerHTML = '<rect x="9" y="9" width="12" height="12" rx="1"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>';
      statusMsg.textContent = 'READY';
    }, 2000);
  });

  /* RESET button when user types a new idea */
  input.addEventListener('input', () => {
    if (isCopied && input.value.trim() !== '') {
      // don't reset unless they change meaningfully — keep simple: reset on next generate
    }
  });

  /* CHATGPT */
  chatBtn.addEventListener('click', () => {
    if (navigator.vibrate) navigator.vibrate(8);
    window.open('https://chatgpt.com', '_blank');
    statusMsg.textContent = 'OPENING CHATGPT';
    setTimeout(()=>{ statusMsg.textContent='READY'; }, 1500);
  });

  /* SERVICE WORKER — inline blob for full offline */
  if ('serviceWorker' in navigator) {
    const swCode = `
      const C = 'animus-prompt-v1';
      self.addEventListener('install', e => {
        e.waitUntil(caches.open(C).then(c => c.addAll(['/','./']).catch(()=>{})));
        self.skipWaiting();
      });
      self.addEventListener('activate', e => {
        e.waitUntil(caches.keys().then(ks => Promise.all(ks.map(k => k!==C ? caches.delete(k) : null))));
        self.clients.claim();
      });
      self.addEventListener('fetch', e => {
        if (e.request.url.startsWith(self.location.origin)) {
          e.respondWith(
            caches.match(e.request).then(r => r || fetch(e.request).then(res => {
              if (res && res.status === 200) {
                const cl = res.clone();
                caches.open(C).then(c => c.put(e.request, cl));
              }
              return res;
            }).catch(()=> new Response('Offline', {status:503})))
          );
        } else {
          e.respondWith(fetch(e.request));
        }
      });
    `;
    const blob = new Blob([swCode], {type:'application/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
  }

})();
</script>

<!-- PWA manifest inline -->
<script>
const manifest = {
  name: "Animus Prompt",
  short_name: "Animus",
  start_url: ".",
  display: "standalone",
  background_color: "#0a0e14",
  theme_color: "#0a0e14",
  icons: [{
    src: "data:image/svg+xml," + encodeURIComponent(
      `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
        <rect width='100' height='100' fill='#0a0e14'/>
        <polygon points='50,10 90,50 50,90 10,50' fill='none' stroke='#00e0ff' stroke-width='6'/>
        <polygon points='50,32 68,50 50,68 32,50' fill='#00e0ff'/>
      </svg>`
    ),
    sizes: "100x100",
    type: "image/svg+xml"
  }]
};
const link = document.createElement('link');
link.rel = 'manifest';
link.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
document.head.appendChild(link);

// iOS PWA meta
const metas = [
  ['apple-mobile-web-app-capable','yes'],
  ['apple-mobile-web-app-status-bar-style','black-translucent'],
  ['apple-mobile-web-app-title','Animus']
];
metas.forEach(([n,c])=>{
  const m = document.createElement('meta');
  m.name = n; m.content = c;
  document.head.appendChild(m);
});
</script>

</body>
</html>
